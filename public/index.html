<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HLS Cloud Encoder — Distributed Video Transcoding</title>
  <meta name="description" content="Cloud-scale distributed HLS encoding dashboard powered by GitHub Actions and Cloudflare R2">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* FULL CSS HERE - dark glassmorphism theme */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-primary: #0a0a1a;
      --bg-secondary: #1a0a2e;
      --bg-tertiary: #0a1628;
      --surface: rgba(255, 255, 255, 0.05);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.08);
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #7c3aed;
      --accent-glow: rgba(124, 58, 237, 0.4);
      --cyan: #06b6d4;
      --cyan-glow: rgba(6, 182, 212, 0.3);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 16px;
      --radius-sm: 10px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated background orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 600px; height: 600px;
      background: var(--accent);
      top: -200px; right: -200px;
      animation: float 20s ease-in-out infinite;
    }
    body::after {
      width: 500px; height: 500px;
      background: var(--cyan);
      bottom: -150px; left: -150px;
      animation: float 25s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -40px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes toastIn {
      from { transform: translateX(120%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes toastOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(120%); opacity: 0; }
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 48px;
      animation: slideUp 0.6s ease-out;
    }
    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      text-shadow: 0 0 40px var(--accent-glow);
    }
    .header p {
      color: var(--text-secondary);
      font-size: 1.05rem;
      font-weight: 300;
    }
    .health-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 8px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }
    .health-badge.online { border-color: rgba(16, 185, 129, 0.3); }
    .health-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
    }
    .health-dot.online {
      background: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
      animation: pulse 2s ease-in-out infinite;
    }

    /* Card styles */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      backdrop-filter: blur(20px);
      transition: all 0.3s ease;
      animation: slideUp 0.6s ease-out both;
    }
    .card:hover {
      border-color: rgba(124, 58, 237, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-title .icon {
      font-size: 1.4rem;
    }

    /* Upload section */
    .upload-section { animation-delay: 0.1s; margin-bottom: 32px; }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(124, 58, 237, 0.05);
      box-shadow: inset 0 0 30px rgba(124, 58, 237, 0.05);
    }
    .drop-zone .drop-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      display: block;
    }
    .drop-zone .drop-text {
      color: var(--text-secondary);
      font-size: 1rem;
    }
    .drop-zone .drop-text strong {
      color: var(--accent);
      cursor: pointer;
    }
    .drop-zone .drop-hint {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 8px;
    }

    .file-info {
      display: none;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: rgba(124, 58, 237, 0.08);
      border: 1px solid rgba(124, 58, 237, 0.15);
      border-radius: var(--radius-sm);
      margin-top: 16px;
    }
    .file-info.visible { display: flex; }
    .file-info .file-icon { font-size: 2rem; }
    .file-info .file-details { flex: 1; }
    .file-info .file-name { font-weight: 600; font-size: 0.95rem; }
    .file-info .file-size { color: var(--text-muted); font-size: 0.8rem; }
    .file-info .file-remove {
      background: none; border: none; color: var(--danger);
      cursor: pointer; font-size: 1.2rem; padding: 4px 8px;
      border-radius: 8px; transition: background 0.2s;
    }
    .file-info .file-remove:hover { background: rgba(239, 68, 68, 0.1); }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 20px;
    }
    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .form-group input::placeholder { color: var(--text-muted); }

    .submit-btn {
      width: 100%;
      margin-top: 24px;
      padding: 14px 32px;
      background: linear-gradient(135deg, var(--accent), #6d28d9);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px var(--accent-glow);
    }
    .submit-btn:active:not(:disabled) { transform: translateY(0); }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .submit-btn .btn-loader {
      display: none;
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .submit-btn.loading .btn-text { display: none; }
    .submit-btn.loading .btn-loader { display: block; }

    /* Progress bar */
    .upload-progress {
      display: none;
      margin-top: 16px;
    }
    .upload-progress.visible { display: block; }
    .progress-bar-track {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 100px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--cyan));
      border-radius: 100px;
      transition: width 0.3s ease;
    }
    .progress-text {
      text-align: right;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Jobs section */
    .jobs-section { animation-delay: 0.2s; }
    .jobs-table-wrap {
      overflow-x: auto;
      margin-top: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 14px 16px;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      color: var(--text-secondary);
    }
    tr:hover td {
      background: rgba(255,255,255,0.02);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: capitalize;
    }
    .status-badge.dispatched {
      background: rgba(245, 158, 11, 0.12);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    .status-badge.completed {
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .status-badge.failed {
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      display: inline-block;
    }
    .dispatched .status-dot { background: var(--warning); animation: pulse 1.5s infinite; }
    .completed .status-dot { background: var(--success); }
    .failed .status-dot { background: var(--danger); }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; display: block; }

    /* Toast notifications */
    .toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      padding: 14px 20px;
      border-radius: var(--radius-sm);
      backdrop-filter: blur(20px);
      font-size: 0.9rem;
      font-weight: 500;
      animation: toastIn 0.4s ease-out;
      min-width: 280px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .toast.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: var(--success);
    }
    .toast.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: var(--danger);
    }
    .toast.removing { animation: toastOut 0.3s ease-in forwards; }

    .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.82rem; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header" id="header">
      <h1>⚡ HLS Cloud Encoder</h1>
      <p>Distributed video transcoding powered by GitHub Actions & Cloudflare R2</p>
      <div class="health-badge" id="healthBadge">
        <span class="health-dot" id="healthDot"></span>
        <span id="healthText">Checking system...</span>
      </div>
    </header>

    <!-- Upload Section -->
    <section class="card upload-section" id="uploadSection">
      <div class="card-title"><span class="icon">🎬</span> Upload Video</div>
      <form id="uploadForm">
        <div class="drop-zone" id="dropZone">
          <span class="drop-icon">📁</span>
          <div class="drop-text">Drag & drop your video here or <strong>browse files</strong></div>
          <div class="drop-hint">Supports MP4, MKV, MOV, AVI — up to 5 GB</div>
          <input type="file" id="fileInput" accept="video/*" hidden>
        </div>

        <div class="file-info" id="fileInfo">
          <span class="file-icon">🎥</span>
          <div class="file-details">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
          </div>
          <button type="button" class="file-remove" id="fileRemove">✕</button>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="outputName">Output Name</label>
            <input type="text" id="outputName" placeholder="my-awesome-video">
          </div>
          <div class="form-group">
            <label for="parentFolder">Parent Folder</label>
            <input type="text" id="parentFolder" placeholder="videos" value="videos">
          </div>
        </div>

        <div class="upload-progress" id="uploadProgress">
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressFill"></div>
          </div>
          <div class="progress-text" id="progressText">0%</div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn" disabled>
          <span class="btn-text">🚀 Start Encoding Pipeline</span>
          <span class="btn-loader"></span>
        </button>
      </form>
    </section>

    <!-- Jobs Section -->
    <section class="card jobs-section" id="jobsSection">
      <div class="card-title"><span class="icon">📊</span> Encoding Jobs</div>
      <div class="jobs-table-wrap">
        <div id="jobsContent">
          <div class="empty-state">
            <span class="empty-icon">📭</span>
            <div>No encoding jobs yet. Upload a video to get started!</div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    // ============ Utilities ============
    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function timeAgo(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> ${message}`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('removing');
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // ============ File Upload Handling ============
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const fileRemove = document.getElementById('fileRemove');
    const submitBtn = document.getElementById('submitBtn');
    const uploadForm = document.getElementById('uploadForm');
    const outputName = document.getElementById('outputName');
    let selectedFile = null;

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

    function handleFile(file) {
      selectedFile = file;
      fileName.textContent = file.name;
      fileSize.textContent = formatBytes(file.size);
      fileInfo.classList.add('visible');
      submitBtn.disabled = false;
      if (!outputName.value) {
        outputName.value = file.name.replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9-_]/g, '-');
      }
    }

    fileRemove.addEventListener('click', () => {
      selectedFile = null;
      fileInput.value = '';
      fileInfo.classList.remove('visible');
      submitBtn.disabled = true;
    });

    // ============ Form Submission ============
    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!selectedFile) return;

      const formData = new FormData();
      formData.append('video', selectedFile);
      formData.append('outputName', outputName.value || selectedFile.name.replace(/\.[^.]+$/, ''));
      formData.append('parentFolder', document.getElementById('parentFolder').value || 'videos');

      submitBtn.disabled = true;
      submitBtn.classList.add('loading');
      const progressEl = document.getElementById('uploadProgress');
      const progressFill = document.getElementById('progressFill');
      const progressText = document.getElementById('progressText');
      progressEl.classList.add('visible');

      try {
        const xhr = new XMLHttpRequest();
        await new Promise((resolve, reject) => {
          xhr.upload.addEventListener('progress', (e) => {
            if (e.lengthComputable) {
              const pct = Math.round((e.loaded / e.total) * 100);
              progressFill.style.width = pct + '%';
              progressText.textContent = pct + '%';
            }
          });
          xhr.addEventListener('load', () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              const resp = JSON.parse(xhr.responseText);
              resolve(resp);
            } else {
              reject(new Error(xhr.responseText));
            }
          });
          xhr.addEventListener('error', () => reject(new Error('Network error')));
          xhr.open('POST', '/api/upload');
          xhr.send(formData);
        });

        showToast('Encoding job dispatched successfully!');
        selectedFile = null;
        fileInput.value = '';
        fileInfo.classList.remove('visible');
        outputName.value = '';
        fetchJobs();
      } catch (err) {
        console.error(err);
        showToast('Failed to dispatch encoding job.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        progressEl.classList.remove('visible');
        progressFill.style.width = '0%';
      }
    });

    // ============ Jobs Polling ============
    async function fetchJobs() {
      try {
        const res = await fetch('/api/jobs');
        const jobs = await res.json();
        const content = document.getElementById('jobsContent');

        if (jobs.length === 0) {
          content.innerHTML = `<div class="empty-state"><span class="empty-icon">📭</span><div>No encoding jobs yet. Upload a video to get started!</div></div>`;
          return;
        }

        let html = `<table><thead><tr><th>Job ID</th><th>File</th><th>Output</th><th>Status</th><th>Started</th><th>Duration</th></tr></thead><tbody>`;
        jobs.forEach(j => {
          html += `<tr>
            <td class="mono">${j.id}</td>
            <td>${j.originalFile}</td>
            <td class="mono">${j.parentFolder}/${j.outputName}</td>
            <td><span class="status-badge ${j.status}"><span class="status-dot"></span>${j.status}</span></td>
            <td>${timeAgo(j.startedAt)}</td>
            <td>${j.timeTaken || '—'}</td>
          </tr>`;
        });
        html += '</tbody></table>';
        content.innerHTML = html;
      } catch (err) { console.error('Failed to fetch jobs:', err); }
    }

    // ============ Health Polling ============
    async function fetchHealth() {
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        const badge = document.getElementById('healthBadge');
        const dot = document.getElementById('healthDot');
        const text = document.getElementById('healthText');
        badge.classList.add('online');
        dot.classList.add('online');
        text.textContent = `Online — ${data.jobCount} jobs tracked`;
      } catch {
        document.getElementById('healthDot').classList.remove('online');
        document.getElementById('healthText').textContent = 'System offline';
      }
    }

    // Initial + intervals
    fetchHealth();
    fetchJobs();
    setInterval(fetchJobs, 5000);
    setInterval(fetchHealth, 10000);
  </script>
</body>
</html>
