name: Distributed HLS Cluster Encoder (Using AES)

on:
  repository_dispatch:
    types: [trigger-encode]

jobs:
  build-and-transcode:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Required Secrets
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          for var in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET_NAME; do
            if [ -z "${!var}" ]; then
              echo "❌ CRITICAL: Missing GitHub Secret: $var"
              exit 1
            fi
          done
          echo "✅ All required repository secrets are present."

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies (FFmpeg, Rclone, yt-dlp)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg
          curl -s https://rclone.org/install.sh | sudo bash
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install Node Dependencies
        run: |
          npm init -y
          npm install fluent-ffmpeg

      - name: Configure Rclone Credentials
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = $R2_ENDPOINT
          acl = private
          EOF

      - name: Configure GDrive Credentials (If needed)
        if: github.event.client_payload.source_type == 'gdrive'
        env:
          GDRIVE_SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GDRIVE_SA_JSON" > /tmp/gdrive-sa.json
          chmod 600 /tmp/gdrive-sa.json
          cat <<EOF >> ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          service_account_file = /tmp/gdrive-sa.json
          scope = drive.readonly
          EOF

      - name: Download Processing Target File
        env:
          SOURCE_TYPE: ${{ github.event.client_payload.source_type }}
          FILE_ID: ${{ github.event.client_payload.gdrive_file_id }}
          ZOOM_URL: ${{ github.event.client_payload.zoom_url }}
          VIDEO_URL: ${{ github.event.client_payload.video_url }}
        run: |
          if [ "$SOURCE_TYPE" = "gdrive" ]; then
            mkdir -p ./gdrive_download
            rclone backend copyid gdrive: "$FILE_ID" ./gdrive_download/ -P
            mv ./gdrive_download/* input.mp4
            rm -rf ./gdrive_download
          elif [ "$SOURCE_TYPE" = "zoom" ]; then
            yt-dlp --no-playlist --merge-output-format mp4 -o "input.mp4" "$ZOOM_URL"
          else
            curl -L "$VIDEO_URL" -o input.mp4
          fi
          
          if [ ! -f input.mp4 ]; then
            echo "❌ ERROR: File download failed. input.mp4 not found."
            exit 1
          fi

      - name: Run Transcoder with AES-128 Encryption
        id: transcode
        env:
          KEY_URL: ${{ github.event.client_payload.key_url }}
        run: |
          cat <<'EOF' > run-encode.js
          const ffmpeg = require('fluent-ffmpeg');
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          
          const input = 'input.mp4';
          const outDir = './output';
          const keyUrl = process.env.KEY_URL || 'fallback.key';
          
          fs.mkdirSync(outDir, { recursive: true });
          
          // Generate AES-128 key
          const rawKey = crypto.randomBytes(16);
          const hexKey = rawKey.toString('hex');
          const keyPath = path.resolve('enc.key');
          const keyInfoPath = path.resolve('key_info.txt');
          
          fs.writeFileSync(keyPath, rawKey);
          fs.writeFileSync(keyInfoPath, `${keyUrl}\n${keyPath}\n${hexKey}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `VIDEO_HEX_KEY=${hexKey}\n`);
          
          ffmpeg.ffprobe(input, (err, metadata) => {
            if (err) {
              console.error('FFprobe Error:', err);
              process.exit(1);
            }
            const videoStream = metadata.streams.find(s => s.codec_type === 'video');
            if (!videoStream) {
              console.error('No video stream found!');
              process.exit(1);
            }
            const audioStream = metadata.streams.find(s => s.codec_type === 'audio');
            const width = videoStream.width || 1920;
            const height = videoStream.height || 1080;
            const duration = Number(metadata.format.duration || 0);
            
            console.log(`Source: ${width}x${height}, duration: ${duration}s`);
            
            // Create thumbnail directly next to master.m3u8.
            const thumbnailTime =
              duration > 10 ? Math.min(10, duration * 0.1) :
              duration > 1 ? 1 : 0;
              
            console.log(`Generating thumbnail at ${thumbnailTime}s...`);
            const thumbnail = ffmpeg(input)
              .seekInput(thumbnailTime)
              .outputOptions(['-frames:v 1'])
              .videoFilters('scale=min(1280\\,iw):-2')
              .outputOptions(['-q:v 2'])
              .output(path.join(outDir, 'thumbnail.jpg'));
              
            thumbnail
              .on('end', () => {
                console.log('Thumbnail created: output/thumbnail.jpg');
                
                // Source-only HLS:
                // copy the existing H.264 video to avoid a full video re-encode,
                // while normalizing audio to AAC 96 kbps stereo.
                const command = ffmpeg(input)
                  .output(path.join(outDir, 'source.m3u8'))
                  .videoCodec('copy');
                  
                if (audioStream) {
                  command
                    .audioCodec('aac')
                    .audioBitrate('96k')
                    .audioChannels(2);
                } else {
                  command.noAudio();
                }
                
                command.addOptions([
                  '-map 0:v:0',
                  ...(audioStream ? ['-map 0:a:0'] : []),
                  '-hls_time 6',
                  '-hls_playlist_type vod',
                  '-hls_segment_filename',
                  path.join(outDir, 'source_%06d.ts'),
                  `-hls_key_info_file ${keyInfoPath}`,
                  '-f hls'
                ]);
                
                command
                  .on('progress', () => process.stdout.write('.'))
                  .on('end', () => {
                    console.log('\nHLS encoding complete.');
                    
                    // Keep the master playlist deliberately simple for broad playback.
                    const master =
                      '#EXTM3U\n' +
                      '#EXT-X-VERSION:3\n' +
                      '#EXT-X-STREAM-INF:BANDWIDTH=500000\n' +
                      'source.m3u8\n';
                      
                    fs.writeFileSync(path.join(outDir, 'master.m3u8'), master);
                    
                    // Verify required output files before upload.
                    for (const file of ['master.m3u8', 'source.m3u8', 'thumbnail.jpg']) {
                      const full = path.join(outDir, file);
                      if (!fs.existsSync(full) || fs.statSync(full).size === 0) {
                        console.error(`Missing or empty output: ${file}`);
                        process.exit(1);
                      }
                    }
                    
                    console.log('Generated HLS:');
                    console.log(fs.readdirSync(outDir).join('\n'));
                    
                    // Securely delete local AES key material.
                    if (fs.existsSync(keyPath)) fs.unlinkSync(keyPath);
                    if (fs.existsSync(keyInfoPath)) fs.unlinkSync(keyInfoPath);
                  })
                  .on('error', (err) => {
                    console.error('FFmpeg HLS Error:', err);
                    process.exit(1);
                  })
                  .run();
              })
              .on('error', (err) => {
                console.error('Thumbnail Error:', err);
                process.exit(1);
              })
              .run();
          });
          EOF
          START_TIME=$(date +%s)
          node run-encode.js
          END_TIME=$(date +%s)
          echo "ELAPSED_SECONDS=$((END_TIME - START_TIME))" >> $GITHUB_ENV

      - name: Deploy Assets to Cloudflare R2
        env:
          PARENT_FOLDER: ${{ github.event.client_payload.parent_folder }}
          OUTPUT_NAME: ${{ github.event.client_payload.output_name }}
          BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -n "$PARENT_FOLDER" ]; then
            TARGET_PATH="$BUCKET/$PARENT_FOLDER/$OUTPUT_NAME"
          else
            TARGET_PATH="$BUCKET/$OUTPUT_NAME"
          fi
          
          echo "Uploading HLS assets to r2:$TARGET_PATH"
          rclone copy ./output "r2:$TARGET_PATH" \
            --transfers 16 \
            --checkers 32 \
            --fast-list \
            --retries 5 \
            --low-level-retries 10 \
            --retries-sleep 2s \
            -P
            
          echo "Uploaded files:"
          rclone ls "r2:$TARGET_PATH" | sort
          
          # Confirm the three critical assets exist in R2.
          for required in master.m3u8 source.m3u8 thumbnail.jpg; do
            if ! rclone ls "r2:$TARGET_PATH/$required" >/dev/null 2>&1; then
              echo "❌ Missing required R2 asset: $required"
              exit 1
            fi
          done
          echo "✅ R2 upload verification passed."

      - name: Cleanup Service Account
        if: always() && github.event.client_payload.source_type == 'gdrive'
        run: rm -f /tmp/gdrive-sa.json

      - name: Trigger Webhook Callback
        if: always()
        env:
          WEBHOOK_URL: ${{ github.event.client_payload.callback_webhook }}
          OUTPUT_NAME: ${{ github.event.client_payload.output_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            # Convert GitHub's "Success"/"Failure" to lowercase for APIs
            STATUS=$(echo "$JOB_STATUS" | tr '[:upper:]' '[:lower:]')
            
            curl -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{
                \"status\": \"$STATUS\",
                \"output_name\": \"$OUTPUT_NAME\",
                \"time_taken_seconds\": \"${ELAPSED_SECONDS:-0}\",
                \"hex_key\": \"${VIDEO_HEX_KEY:-}\"
              }"
          else
            echo "No webhook URL provided. Skipping callback."
          fi
