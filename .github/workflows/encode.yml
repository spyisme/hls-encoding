name: Distributed HLS Cluster Encoder (Using AES)

on:
  repository_dispatch:
    types: [trigger-encode]

jobs:
  build-and-transcode:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Required Secrets
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          for var in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET_NAME; do
            if [ -z "${!var}" ]; then
              echo "❌ CRITICAL: Missing GitHub Secret: $var"
              exit 1
            fi
          done
          echo "✅ All required repository secrets are present."

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies (FFmpeg, Rclone, yt-dlp)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg
          curl -s https://rclone.org/install.sh | sudo bash
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install Node Dependencies
        run: |
          npm init -y
          npm install fluent-ffmpeg

      - name: Configure Rclone Credentials
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = $R2_ACCESS_KEY_ID
          secret_access_key = $R2_SECRET_ACCESS_KEY
          endpoint = $R2_ENDPOINT
          acl = private
          EOF

      - name: Configure GDrive Credentials (If needed)
        if: github.event.client_payload.source_type == 'gdrive'
        env:
          GDRIVE_SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GDRIVE_SA_JSON" > /tmp/gdrive-sa.json
          chmod 600 /tmp/gdrive-sa.json
          cat <<EOF >> ~/.config/rclone/rclone.conf

          [gdrive]
          type = drive
          service_account_file = /tmp/gdrive-sa.json
          scope = drive.readonly
          EOF

      - name: Download Processing Target File
        env:
          SOURCE_TYPE: ${{ github.event.client_payload.source_type }}
          FILE_ID: ${{ github.event.client_payload.gdrive_file_id }}
          ZOOM_URL: ${{ github.event.client_payload.zoom_url }}
          VIDEO_URL: ${{ github.event.client_payload.video_url }}
        run: |
          if [ "$SOURCE_TYPE" = "gdrive" ]; then
            rclone backend copyid gdrive: "$FILE_ID" ./gdrive_download -P
            mv ./gdrive_download/* input.mp4
            rm -rf ./gdrive_download
          
          elif [ "$SOURCE_TYPE" = "zoom" ]; then
            yt-dlp --no-playlist --merge-output-format mp4 -o "input.mp4" "$ZOOM_URL"
          
          else
            curl -L "$VIDEO_URL" -o input.mp4
          fi

          if [ ! -f input.mp4 ]; then
            echo "❌ ERROR: File download failed. input.mp4 not found."
            exit 1
          fi

      - name: Run Transcoder with AES-128 Encryption
        id: transcode
        env:
          KEY_URL: ${{ github.event.client_payload.key_url }}
        run: |
          cat <<'EOF' > run-encode.js
          const ffmpeg = require('fluent-ffmpeg');
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          
          const input = 'input.mp4';
          const outDir = './output/media';
          const keyUrl = process.env.KEY_URL || 'fallback.key';
          
          fs.mkdirSync(outDir, { recursive: true });

          // Generate AES-128 Key
          const rawKey = crypto.randomBytes(16);
          const hexKey = rawKey.toString('hex');
          const keyPath = path.resolve('enc.key');
          const keyInfoPath = path.resolve('key_info.txt');

          // Save Key Locally & Write Key Info for FFmpeg
          fs.writeFileSync(keyPath, rawKey);
          fs.writeFileSync(keyInfoPath, `${keyUrl}\n${keyPath}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `VIDEO_HEX_KEY=${hexKey}\n`);

          ffmpeg.ffprobe(input, (err, metadata) => {
            if (err) { console.error("FFprobe Error:", err); process.exit(1); }
            
            const videoStream = metadata.streams.find(s => s.codec_type === 'video');
            if (!videoStream) { console.error("No video stream found!"); process.exit(1); }

            const nativeHeight = videoStream.height || 720;
            const duration = metadata.format.duration || 10;
            
            // Generate Thumbnail
            const randomTime = Math.floor(Math.random() * (duration * 0.8)) + (duration * 0.1);
            ffmpeg(input).screenshots({
              timestamps: [randomTime],
              filename: 'thumbnail.jpg',
              folder: './output',
              size: nativeHeight >= 1080 ? '1920x1080' : '1280x720'
            }).on('end', () => {
              
              const command = ffmpeg(input);
              const activeTiers = [];
              const tiersConfig = [
                { maxTarget: 480, res: '854x480', vBit: '800k', name: '480p' },
                { maxTarget: 720, res: '1280x720', vBit: '2800k', name: '720p' },
                { maxTarget: 1080, res: '1920x1080', vBit: '5000k', name: '1080p' }
              ];

              tiersConfig.forEach(tier => {
                if (nativeHeight >= tier.maxTarget) {
                  command.output(path.join(outDir, `${tier.name}.m3u8`))
                    .videoCodec('libx264').audioCodec('aac').size(tier.res).videoBitrate(tier.vBit)
                    .addOptions([
                      '-preset veryfast', '-g 60', '-hls_time 6', '-hls_playlist_type vod',
                      `-hls_key_info_file ${keyInfoPath}`,
                      `-hls_segment_filename ${outDir}/${tier.name}_%03d.ts`
                    ]);
                  activeTiers.push(tier);
                }
              });

              // Fallback if video is smaller than 480p
              if (activeTiers.length === 0) {
                const width = videoStream.width || Math.round((nativeHeight * 16) / 9);
                const fallbackName = `${nativeHeight}p`;
                command.output(path.join(outDir, `${fallbackName}.m3u8`))
                  .videoCodec('libx264').audioCodec('aac')
                  .addOptions([
                    '-preset veryfast', '-g 60', '-hls_time 6', '-hls_playlist_type vod',
                    `-hls_key_info_file ${keyInfoPath}`,
                    `-hls_segment_filename ${outDir}/${fallbackName}_%03d.ts`
                  ]);
                activeTiers.push({ res: `${width}x${nativeHeight}`, vBit: '500k', name: fallbackName });
              }

              // Run Encoding
              command.on('progress', (p) => process.stdout.write(`.`))
              .on('end', () => {
                console.log("\n✅ Encoding Complete!");
                
                // Write Master Playlist
                let master = `#EXTM3U\n#EXT-X-VERSION:3\n`;
                activeTiers.forEach(t => {
                  master += `#EXT-X-STREAM-INF:BANDWIDTH=${parseInt(t.vBit) * 1000},RESOLUTION=${t.res}\nmedia/${t.name}.m3u8\n`;
                });
                fs.writeFileSync('./output/master.m3u8', master);

                // Securely delete AES key so it isn't uploaded
                if (fs.existsSync(keyPath)) fs.unlinkSync(keyPath);
                if (fs.existsSync(keyInfoPath)) fs.unlinkSync(keyInfoPath);

              }).on('error', (err) => { 
                console.error("FFmpeg Error:", err); 
                process.exit(1); 
              }).run();
            });
          });
          EOF
          
          START_TIME=$(date +%s)
          node run-encode.js
          END_TIME=$(date +%s)
          echo "ELAPSED_SECONDS=$((END_TIME - START_TIME))" >> $GITHUB_ENV

      - name: Deploy Assets to Cloudflare R2
        env:
          PARENT_FOLDER: ${{ github.event.client_payload.parent_folder }}
          OUTPUT_NAME: ${{ github.event.client_payload.output_name }}
          BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          # Handle empty parent_folder cleanly
          if [ -n "$PARENT_FOLDER" ]; then
            TARGET_PATH="$BUCKET/$PARENT_FOLDER/$OUTPUT_NAME"
          else
            TARGET_PATH="$BUCKET/$OUTPUT_NAME"
          fi

          rclone copy ./output "r2:$TARGET_PATH" \
            --transfers 16 --checkers 32 --fast-list -P

      - name: Cleanup Service Account
        if: always() && github.event.client_payload.source_type == 'gdrive'
        run: rm -f /tmp/gdrive-sa.json

      - name: Trigger Webhook Callback
        if: always()
        env:
          WEBHOOK_URL: ${{ github.event.client_payload.callback_webhook }}
          OUTPUT_NAME: ${{ github.event.client_payload.output_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            # Convert GitHub's "Success"/"Failure" to lowercase for APIs
            STATUS=$(echo "$JOB_STATUS" | tr '[:upper:]' '[:lower:]')
            
            curl -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{
                \"status\": \"$STATUS\",
                \"output_name\": \"$OUTPUT_NAME\",
                \"time_taken_seconds\": \"${ELAPSED_SECONDS:-0}\",
                \"hex_key\": \"${VIDEO_HEX_KEY:-}\"
              }"
          else
            echo "No webhook URL provided. Skipping callback."
          fi
